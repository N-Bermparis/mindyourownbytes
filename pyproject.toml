[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mindyourownbytes"
dynamic = ["version"]
description = "Your files. Your keys. None of their business. Encrypt files locally with GnuPG before they reach any cloud."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Nikolaos Bermparis" }]
keywords = ["encryption", "gnupg", "openpgp", "privacy", "cloud-storage", "backup", "pyside6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Backup",
]
# Essentials holds the only Qt modules used here (Core, Gui, Widgets). The full
# PySide6 package adds hundreds of MB, including a web engine, that a local-only
# security tool has no reason to ship.
dependencies = ["PySide6-Essentials>=6.7,<7"]

[project.gui-scripts]
mindyourownbytes = "mindyourownbytes.gui.main_window:main"

[project.urls]
Homepage = "https://github.com/N-Bermparis/mindyourownbytes"
Issues = "https://github.com/N-Bermparis/mindyourownbytes/issues"
Security = "https://github.com/N-Bermparis/mindyourownbytes/blob/main/SECURITY.md"
Changelog = "https://github.com/N-Bermparis/mindyourownbytes/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "mindyourownbytes.__version__" }

[tool.setuptools.packages.find]
include = ["mindyourownbytes*"]

[tool.setuptools.package-data]
mindyourownbytes = ["styles.qss"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET",
    "S",    # flake8-bandit: security-focused checks
]
ignore = [
    "S101",  # assert is used only for internal invariants, never for validation
    "S603",  # all subprocess calls pass fixed argument lists, with no shell
    "S607",
    "SIM105",
    "RET505",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
