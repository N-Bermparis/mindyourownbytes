name: Downloads

# Builds the downloads for Windows, Linux, and macOS, then tests each the way people will use
# it, on fresh machines that have only ever seen the finished files. A pull request stops there,
# with the files kept as artifacts for anyone to try. A version tag also creates a draft release
# with all three, which a person checks and then publishes.
#
# Mac minutes cost ten times as much as Linux ones, so the macOS download is built only for a
# version tag, a manual run, or a pull request that changes the packaging itself.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CHANGELOG.md
      - LICENSE
      - build_windows_exe.bat
      - mindyourownbytes/**
      - packaging/**
      - requirements.txt
      - requirements-build.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downloads-${{ github.ref }}
  # Never cancel a tag's build partway through.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build for Windows
    # Named rather than windows-latest, so that a release doesn't change build machine by surprise.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No pip cache: what's in a download shouldn't depend on what an earlier run left behind.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-build.txt
      # Code signing is off until a certificate is set up, and then only for a version tag. Its key has to
      # live in hardware or a cloud signing service, whose own setup step goes here, before the build. Then
      # set the repository variables below. packaging/signing.py signs, and checks every signature.
      - name: Build the download
        shell: pwsh
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          MYOB_SIGN_CERT_SHA1: ${{ github.ref_type == 'tag' && vars.WINDOWS_SIGN_CERT_SHA1 || '' }}
          MYOB_SIGN_TIMESTAMP_URL: ${{ github.ref_type == 'tag' && vars.WINDOWS_SIGN_TIMESTAMP_URL || '' }}
        run: |
          if ($env:TAG) {
            python packaging/build_windows.py --tag $env:TAG
          } else {
            python packaging/build_windows.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-download
          path: |
            dist/release
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14
          # The installer and zip are already compressed.
          compression-level: 0

  test:
    name: Test on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 2025 is close to Windows 11. 2022 has Windows 10's interface and system libraries.
        os: [windows-2025, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only to run the test script. The app brings its own Python, and nothing gets installed for it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-download
          path: dist
      - name: Test it the way people will use it
        run: python packaging/check_windows_download.py
      - name: Keep the test results and pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results-${{ matrix.os }}
          path: dist/check
          retention-days: 14

  build-linux:
    name: Build for Linux
    # The oldest Ubuntu GitHub offers, because a download built on newer Linux won't run on older.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-build.txt
      # Qt draws under X11 with these, and many desktops lack some of them. The build copies the
      # ones it finds into the download, so with them installed here, the download brings its own.
      - name: Install the libraries for the download to carry
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0
      - name: Build the download
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python packaging/build_unix.py --tag "$TAG"
          else
            python packaging/build_unix.py
          fi
      - name: Keep the download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-download
          path: dist/release
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  test-linux:
    name: Test on ${{ matrix.os }}
    needs: build-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      # Only for the script that looks inside the download. It runs on the system's own Python, and
      # nothing gets installed for the app.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-download
          path: dist/download
      - name: Check the checksums
        working-directory: dist/download
        run: sha256sum --check SHA256SUMS.txt
      # The app needs GnuPG and a display to draw on, and every desktop has these graphics and font
      # libraries. The rest of what Qt needs comes in the download, and leaving it out here checks that.
      - name: Install what every Linux desktop has
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnupg xvfb libegl1 libgl1 libfontconfig1 \
            libdbus-1-3 libxcb1
      - name: Unpack it
        run: tar -xzf dist/download/mindyourownbytes-*-linux-x86_64.tar.gz -C dist
      - name: Check that it holds no network code
        run: python3 packaging/check_unix_download.py dist/mindyourownbytes
      - name: Let it test itself
        run: xvfb-run --auto-servernum dist/mindyourownbytes/mindyourownbytes --self-test dist/check
      - name: Keep the test results and pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results-${{ matrix.os }}
          path: dist/check
          retention-days: 14

  changes:
    name: See whether the packaging changed
    # Runs for every event, and says yes outside pull requests. If this job were skipped, GitHub
    # would also skip the jobs that come after it, down to the release.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] ||
            git diff --name-only "$BASE" HEAD | grep -qE '^(packaging/|\.github/workflows/release\.yml$|requirements(-build)?\.txt$)'; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    name: Build for macOS
    needs: changes
    if: ${{ needs.changes.outputs.packaging == 'true' }}
    # Apple silicon. Named rather than macos-latest, for the same reason as Windows. GitHub retired
    # macos-14 on 2 November 2026, so this is the oldest macOS it still offers.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-build.txt
      # Signing and notarizing are off until a Developer ID is set up, and then only for a version tag.
      # The certificate goes into a keychain that exists only for this run, and only codesign may use it.
      - name: Unlock the Developer ID for this run
        if: ${{ github.ref_type == 'tag' && vars.MAC_SIGN_IDENTITY != '' }}
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.MAC_NOTARY_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          umask 077
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if [ -n "$NOTARY_KEY_P8" ]; then printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"; fi
      - name: Build the download
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          MYOB_MAC_SIGN_IDENTITY: ${{ github.ref_type == 'tag' && vars.MAC_SIGN_IDENTITY || '' }}
          MYOB_NOTARY_KEY_PATH: >-
            ${{ github.ref_type == 'tag' && vars.MAC_SIGN_IDENTITY != '' && vars.MAC_NOTARY_KEY_ID != ''
            && format('{0}/notary.p8', runner.temp) || '' }}
          MYOB_NOTARY_KEY_ID: ${{ github.ref_type == 'tag' && vars.MAC_NOTARY_KEY_ID || '' }}
          MYOB_NOTARY_ISSUER: ${{ github.ref_type == 'tag' && vars.MAC_NOTARY_ISSUER || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python packaging/build_unix.py --tag "$TAG"
          else
            python packaging/build_unix.py
          fi
      - name: Lock the Developer ID away again
        if: ${{ always() && github.ref_type == 'tag' && vars.MAC_SIGN_IDENTITY != '' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/developer-id.p12"
      - name: Keep the download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-download
          path: dist/release
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  test-macos:
    name: Test on ${{ matrix.os }}
    needs: build-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest macOS on Apple silicon that GitHub offers.
        os: [macos-15, macos-26]
    steps:
      # Only for the script that looks inside the download, as on Linux.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-download
          path: dist/download
      - name: Check the checksums
        working-directory: dist/download
        run: shasum -a 256 --check SHA256SUMS.txt
      - name: Install GnuPG, as people do
        run: brew install gnupg
      - name: Install it from the disk image
        run: |
          mkdir -p "$RUNNER_TEMP/image" "$RUNNER_TEMP/Applications"
          hdiutil attach dist/download/mindyourownbytes-*-macos-arm64.dmg -nobrowse -mountpoint "$RUNNER_TEMP/image"
          ditto "$RUNNER_TEMP/image/mindyourownbytes.app" "$RUNNER_TEMP/Applications/mindyourownbytes.app"
          hdiutil detach "$RUNNER_TEMP/image"
      - name: Check that it holds no network code
        run: python3 packaging/check_unix_download.py "$RUNNER_TEMP/Applications/mindyourownbytes.app"
      - name: Let it test itself
        run: |
          "$RUNNER_TEMP/Applications/mindyourownbytes.app/Contents/MacOS/mindyourownbytes" --self-test dist/check
      - name: Keep the test results and pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results-${{ matrix.os }}
          path: dist/check
          retention-days: 14

  tag:
    name: Check the tag's signature
    # A signed tag lets anyone check, with `git verify-tag`, that a maintainer chose this commit. Once the
    # TAG_SIGNING_FINGERPRINTS variable lists the keys that sign tags, this stops a release whose tag isn't
    # signed by one of them, with its public key in packaging/release-keys.asc. That catches a mistake, not
    # someone who can push: what runs is the workflow in the tagged commit, which they could change too.
    # Who can push a version tag at all is up to the repository's rulesets (docs/RELEASE_CHECKLIST.md).
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      signer: ${{ steps.verify.outputs.signer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs nothing from the repository: the keys file is only read, and the fingerprint decides.
      - name: Check who signed the tag
        id: verify
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED: ${{ vars.TAG_SIGNING_FINGERPRINTS }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED" | tr 'a-f' 'A-F')"
          if [ -z "${expected//[[:space:]]/}" ]; then
            echo "::warning title=Tag signature not checked::The TAG_SIGNING_FINGERPRINTS variable isn't set, so nothing checks who signed $TAG. See Signing tags in docs/RELEASE_CHECKLIST.md."
            exit 0
          fi
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error title=Tag not signed::$TAG is a lightweight tag, which can't be signed. Make it with git tag -s."
            exit 1
          fi
          if [ ! -f packaging/release-keys.asc ]; then
            echo "::error title=No public keys::packaging/release-keys.asc, with the public keys that sign tags, is missing."
            exit 1
          fi
          home="$(mktemp -d)"
          trap 'gpgconf --homedir "$home" --kill all 2>/dev/null || true; rm -rf "$home"' EXIT
          gpg --homedir "$home" --batch --quiet --import packaging/release-keys.asc
          # GnuPG's status lines say exactly which key made a good signature, in any language.
          status="$(GNUPGHOME="$home" git verify-tag --raw "$TAG" 2>&1 >/dev/null || true)"
          signer="$(printf '%s\n' "$status" | awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print $NF }' | head -n 1)"
          if ! printf '%s\n' "$status" | grep -q '^\[GNUPG:\] GOODSIG ' || [ -z "$signer" ]; then
            echo "::error title=Tag not verified::$TAG has no good signature from a key in packaging/release-keys.asc."
            exit 1
          fi
          for fingerprint in $expected; do
            if [ "$signer" = "$fingerprint" ]; then
              echo "signer=$signer" >> "$GITHUB_OUTPUT"
              echo "$TAG is signed with the key $signer." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error title=Unexpected signer::$TAG is signed with $signer, which isn't in TAG_SIGNING_FINGERPRINTS."
          exit 1

  collect:
    name: Put the release together
    if: ${{ github.ref_type == 'tag' }}
    needs: [tag, test, test-linux, test-macos]
    # Runs the repository's script, so it gets no write access.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-download'
          path: downloads
      - name: One folder, one list of checksums, and the notes
        run: python3 packaging/collect_release.py downloads dist
      - name: Keep the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/release
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  sign-checksums:
    name: Sign the list of checksums
    # Off until a release key is set up: its fingerprint as a variable, and the key and its passphrase as
    # secrets of the release-signing environment, which can require a person's approval for each run.
    if: ${{ github.ref_type == 'tag' && vars.RELEASE_KEY_FINGERPRINT != '' }}
    needs: collect
    # Runs nothing from the repository, can't write to it, and is the only job that sees the key.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Sign SHA256SUMS.txt, then check it as people will
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
          FINGERPRINT: ${{ vars.RELEASE_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          signing_home="$(mktemp -d)"
          checking_home="$(mktemp -d)"
          trap 'gpgconf --homedir "$signing_home" --kill all; rm -rf "$signing_home" "$checking_home" public.gpg' EXIT
          printf '%s\n' "$SIGNING_KEY" | gpg --homedir "$signing_home" --batch --quiet --import
          printf '%s\n' "$SIGNING_PASSPHRASE" | gpg --homedir "$signing_home" --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --local-user "$FINGERPRINT" --armor --detach-sign \
            --output release/SHA256SUMS.txt.asc release/SHA256SUMS.txt
          # Only the public key, and only the fingerprint people are told to expect.
          gpg --homedir "$signing_home" --batch --export "$FINGERPRINT" > public.gpg
          gpg --homedir "$checking_home" --batch --quiet --import public.gpg
          gpg --homedir "$checking_home" --batch --status-fd 1 --verify release/SHA256SUMS.txt.asc \
            release/SHA256SUMS.txt | grep -E "^\[GNUPG:\] VALIDSIG [0-9A-F]+ .* $FINGERPRINT$"
      - name: Keep the signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signature
          path: release/SHA256SUMS.txt.asc
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create a draft release
    # Waits for the signature when there is one, and goes ahead without it when signing is off.
    if: >-
      ${{ github.ref_type == 'tag' && !cancelled() && needs.collect.result == 'success'
      && (needs.sign-checksums.result == 'success' || needs.sign-checksums.result == 'skipped') }}
    needs: [tag, collect, sign-checksums]
    # Only this job can write to the repository, and it runs nothing from the repository.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.sign-checksums.result == 'success' }}
        with:
          name: release-signature
          path: release
      # Lets anyone confirm that a file came from this workflow, with `gh attestation verify`.
      # GitHub only offers this to public repositories on this plan.
      - name: Record where the files came from
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Say which key signed the tag
        if: ${{ needs.tag.outputs.signer != '' }}
        env:
          TAG: ${{ github.ref_name }}
          SIGNER: ${{ needs.tag.outputs.signer }}
        run: |
          printf '\nThe source of this release is the tag %s, signed with the OpenPGP key %s. ' "$TAG" "$SIGNER" >> release-notes.md
          printf 'To check it in a copy of the repository: git verify-tag %s\n' "$TAG" >> release-notes.md
      # --verify-tag only makes sure the tag already exists, so that gh doesn't make one. It checks no signature:
      # the tag job above does, once it's set up.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" release/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --prerelease
          --verify-tag
          --title "mindyourownbytes $TAG"
          --notes-file release-notes.md
