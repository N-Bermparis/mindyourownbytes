name: Downloads

# Builds the downloads for Windows, Linux, and macOS, then tests each the way people will use
# it, on fresh machines that have only ever seen the finished files. A pull request stops there,
# with the files kept as artifacts for anyone to try. A version tag also creates a draft release
# with all three, which a person checks and then publishes.
#
# Mac minutes cost ten times as much as Linux ones, so the macOS download is built only for a
# version tag, a manual run, or a pull request that changes the packaging itself.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CHANGELOG.md
      - LICENSE
      - build_windows_exe.bat
      - mindyourownbytes/**
      - packaging/**
      - requirements.txt
      - requirements-build.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downloads-${{ github.ref }}
  # Never cancel a tag's build partway through.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build for Windows
    # Named rather than windows-latest, so that a release doesn't change build machine by surprise.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No pip cache: what's in a download shouldn't depend on what an earlier run left behind.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-build.txt
      - name: Build the download
        shell: pwsh
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if ($env:TAG) {
            python packaging/build_windows.py --tag $env:TAG
          } else {
            python packaging/build_windows.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-download
          path: |
            dist/release
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14
          # The installer and zip are already compressed.
          compression-level: 0

  test:
    name: Test on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 2025 is close to Windows 11. 2022 has Windows 10's interface and system libraries.
        os: [windows-2025, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only to run the test script. The app brings its own Python, and nothing gets installed for it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-download
          path: dist
      - name: Test it the way people will use it
        run: python packaging/check_windows_download.py
      - name: Keep the test results and pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results-${{ matrix.os }}
          path: dist/check
          retention-days: 14

  build-linux:
    name: Build for Linux
    # The oldest Ubuntu GitHub offers, because a download built on newer Linux won't run on older.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-build.txt
      # Qt draws under X11 with these, and many desktops lack some of them. The build copies the
      # ones it finds into the download, so with them installed here, the download brings its own.
      - name: Install the libraries for the download to carry
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0
      - name: Build the download
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python packaging/build_unix.py --tag "$TAG"
          else
            python packaging/build_unix.py
          fi
      - name: Keep the download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-download
          path: dist/release
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  test-linux:
    name: Test on ${{ matrix.os }}
    needs: build-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-download
          path: dist/download
      - name: Check the checksums
        working-directory: dist/download
        run: sha256sum --check SHA256SUMS.txt
      # The app needs GnuPG and a display to draw on, and every desktop has these graphics and font
      # libraries. The rest of what Qt needs comes in the download, and leaving it out here checks that.
      - name: Install what every Linux desktop has
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnupg xvfb libegl1 libgl1 libfontconfig1 \
            libdbus-1-3 libxcb1
      - name: Unpack it and let it test itself
        run: |
          tar -xzf dist/download/mindyourownbytes-*-linux-x86_64.tar.gz -C dist
          xvfb-run --auto-servernum dist/mindyourownbytes/mindyourownbytes --self-test dist/check
      - name: Keep the test results and pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results-${{ matrix.os }}
          path: dist/check
          retention-days: 14

  changes:
    name: See whether the packaging changed
    # Runs for every event, and says yes outside pull requests. If this job were skipped, GitHub
    # would also skip the jobs that come after it, down to the release.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] ||
            git diff --name-only "$BASE" HEAD | grep -qE '^(packaging/|\.github/workflows/release\.yml$|requirements(-build)?\.txt$)'; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    name: Build for macOS
    needs: changes
    if: ${{ needs.changes.outputs.packaging == 'true' }}
    # Apple silicon. Named rather than macos-latest, for the same reason as Windows.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-build.txt
      - name: Build the download
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python packaging/build_unix.py --tag "$TAG"
          else
            python packaging/build_unix.py
          fi
      - name: Keep the download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-download
          path: dist/release
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  test-macos:
    name: Test on macOS
    needs: build-macos
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-download
          path: dist/download
      - name: Check the checksums
        working-directory: dist/download
        run: shasum -a 256 --check SHA256SUMS.txt
      - name: Install GnuPG, as people do
        run: brew install gnupg
      - name: Install it from the disk image and let it test itself
        run: |
          mkdir -p "$RUNNER_TEMP/image" "$RUNNER_TEMP/Applications"
          hdiutil attach dist/download/mindyourownbytes-*-macos-arm64.dmg -nobrowse -mountpoint "$RUNNER_TEMP/image"
          ditto "$RUNNER_TEMP/image/mindyourownbytes.app" "$RUNNER_TEMP/Applications/mindyourownbytes.app"
          hdiutil detach "$RUNNER_TEMP/image"
          "$RUNNER_TEMP/Applications/mindyourownbytes.app/Contents/MacOS/mindyourownbytes" --self-test dist/check
      - name: Keep the test results and pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results-macos
          path: dist/check
          retention-days: 14

  collect:
    name: Put the release together
    if: ${{ github.ref_type == 'tag' }}
    needs: [test, test-linux, test-macos]
    # Runs the repository's script, so it gets no write access.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-download'
          path: downloads
      - name: One folder, one list of checksums, and the notes
        run: python3 packaging/collect_release.py downloads dist
      - name: Keep the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/release
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Create a draft release
    if: ${{ github.ref_type == 'tag' }}
    needs: collect
    # Only this job can write to the repository, and it runs nothing from the repository.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      # Lets anyone confirm that a file came from this workflow, with `gh attestation verify`.
      # GitHub only offers this to public repositories on this plan.
      - name: Record where the files came from
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" release/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --prerelease
          --verify-tag
          --title "mindyourownbytes $TAG"
          --notes-file release-notes.md
