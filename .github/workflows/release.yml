name: Windows download

# Builds the installer and portable zip, then tests them the way people will use them, on
# fresh machines that have only ever seen the finished files. A pull request stops there,
# with the files kept as an artifact for anyone to try. A version tag also creates a draft
# release, which a person checks and then publishes.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CHANGELOG.md
      - LICENSE
      - build_windows_exe.bat
      - mindyourownbytes/**
      - packaging/**
      - requirements.txt
      - requirements-build.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-download-${{ github.ref }}
  # Never cancel a tag's build partway through.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build
    # Named rather than windows-latest, so that a release doesn't change build machine by surprise.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No pip cache: what's in a download shouldn't depend on what an earlier run left behind.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-build.txt
      - name: Build the download
        shell: pwsh
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if ($env:TAG) {
            python packaging/build_windows.py --tag $env:TAG
          } else {
            python packaging/build_windows.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-download
          path: |
            dist/release
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14
          # The installer and zip are already compressed.
          compression-level: 0

  test:
    name: Test on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 2025 is close to Windows 11. 2022 has Windows 10's interface and system libraries.
        os: [windows-2025, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only to run the test script. The app brings its own Python, and nothing gets installed for it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-download
          path: dist
      - name: Test it the way people will use it
        run: python packaging/check_windows_download.py
      - name: Keep the test results and pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results-${{ matrix.os }}
          path: dist/check
          retention-days: 14

  publish:
    name: Create a draft release
    if: ${{ github.ref_type == 'tag' }}
    needs: test
    # Only this job can write to the repository, and it runs nothing from the repository.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-download
      # Lets anyone confirm that a file came from this workflow, with `gh attestation verify`.
      # GitHub only offers this to public repositories on this plan.
      - name: Record where the files came from
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" release/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --prerelease
          --verify-tag
          --title "mindyourownbytes $TAG"
          --notes-file release-notes.md
