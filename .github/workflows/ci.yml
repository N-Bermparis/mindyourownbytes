name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install linters
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint, including security rules
        run: python -m ruff check .

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pip-audit
        run: python -m pip install --require-hashes -r requirements-audit.txt
      # Every locked file, for every platform: each pins exact versions with hashes, so nothing is resolved
      # or installed. Known vulnerabilities come from the Python Packaging Advisory Database, through PyPI.
      - name: Check the locked dependencies for known vulnerabilities
        run: >-
          python -m pip_audit --strict --progress-spinner off --disable-pip --require-hashes
          -r requirements.txt -r requirements-build.txt -r requirements-dev.txt -r requirements-audit.txt

  tests:
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.14']
        include:
          - os: ubuntu-latest
            python-version: '3.13'
          # Publishing without replacing anything uses a different system call on a Mac (renamex_np),
          # which only a Mac can show working. One Python is enough, as Mac minutes cost more.
          - os: macos-latest
            python-version: '3.14'
    env:
      QT_QPA_PLATFORM: offscreen
      # A missing GnuPG must fail the build, not skip every cryptography test.
      MYOB_REQUIRE_GPG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install GnuPG and Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0t64
      - name: Install GnuPG (macOS)
        if: runner.os == 'macOS'
        run: brew install gnupg
      # The same GnuPG that the Windows download includes, from its pinned official package.
      - name: Install native GnuPG (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $bin = python packaging/build_windows.py --gnupg-only (Join-Path $env:RUNNER_TEMP 'gnupg') | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $bin
          & (Join-Path $bin 'gpg.exe') --version | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $bin
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Show GnuPG in use
        run: python -c "from mindyourownbytes.core import find_gpg, gpg_version; p = find_gpg(); print(p, gpg_version(p))"
      - name: Run tests against real GnuPG
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14') }}
        run: python -m unittest discover -s tests -t . -v
      # One run measures which lines the tests reach. Covered isn't the same as correct: it shows what no
      # test runs at all. Its settings are in pyproject.toml. A minimum share can follow once Linux has a baseline.
      - name: Run tests against real GnuPG, measuring coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' }}
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m coverage run -m unittest discover -s tests -t . -v
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage html
          python -m coverage report
      - name: Keep the coverage report
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: htmlcov
          retention-days: 14
          if-no-files-found: ignore

# Passing CI is a baseline quality signal, NOT a cryptographic security audit.
