name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install linters
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint, including security rules
        run: python -m ruff check .

  tests:
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
    env:
      QT_QPA_PLATFORM: offscreen
      # A missing GnuPG must fail the build, not skip every cryptography test.
      MYOB_REQUIRE_GPG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install GnuPG and Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0t64
      - name: Install native GnuPG (Windows)
        if: runner.os == 'Windows'
        run: choco install gnupg --yes --no-progress
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Show GnuPG in use
        run: python -c "from mindyourownbytes.core import find_gpg, gpg_version; p = find_gpg(); print(p, gpg_version(p))"
      - name: Run tests against real GnuPG
        run: python -m unittest discover -s tests -t . -v

# Passing CI is a baseline quality signal, NOT a cryptographic security audit.
