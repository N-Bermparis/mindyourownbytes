name: Website

# Publishes the project's website, docs/index.html, with GitHub Pages. Only the page and the files
# it uses go up. The Markdown files beside it are the project's docs, which the page links to on
# GitHub. GitHub's own Pages build would also turn them into pages, with a theme that loads a script
# from elsewhere, and the website promises that it loads nothing from anyone else.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - docs/index.html
      - docs/site.css
      - docs/site.js
      - docs/assets/**
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - docs/index.html
      - docs/site.css
      - docs/site.js
      - docs/assets/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never stop a publish partway through.
  cancel-in-progress: false

jobs:
  build:
    name: Put the site together
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy only the site's own files
        run: |
          mkdir _site
          cp docs/index.html docs/site.css docs/site.js _site/
          cp -R docs/assets _site/assets
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publish:
    name: Publish it
    needs: build
    # Only main is published. A pull request stops at checking that the site goes together.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
